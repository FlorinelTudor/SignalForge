  <rect class="actor" x="287" y="130" width="205" height="110" rx="8"/>
  <rect class="actorHead" x="287" y="130" width="205" height="34" rx="8"/>
  <text class="actorTitle" x="298" y="153">DbCommand1</text>
  <text class="actorSub" x="299" y="186">[result] / affected</text>

  <rect class="actor" x="287" y="330" width="205" height="85" rx="8"/>
  <rect class="actorHead" x="287" y="330" width="205" height="34" rx="8"/>
  <text class="actorTitle" x="298" y="353">FabricSetRead1</text>
  <text class="actorSub" x="299" y="384">g_activity_refreshed</text>

  <rect class="actor" x="287" y="425" width="205" height="85" rx="8"/>
  <rect class="actorHead" x="287" y="425" width="205" height="34" rx="8"/>
  <text class="actorTitle" x="298" y="448">FabricSetRead2</text>
  <text class="actorSub" x="299" y="479">g_cases_refreshed</text>

  <rect class="actor" x="287" y="520" width="205" height="85" rx="8"/>
  <rect class="actorHead" x="287" y="520" width="205" height="34" rx="8"/>
  <text class="actorTitle" x="298" y="543">FabricSetRead3</text>
  <text class="actorSub" x="299" y="574">g_case_note_refreshed</text>

