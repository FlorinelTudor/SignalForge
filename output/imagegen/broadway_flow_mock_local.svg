  <rect class="actorHead" x="1290" y="130" width="270" height="34" rx="8"/>
  <text class="actorTitle" x="1301" y="153">Business_Table</text>
  <text class="actorSub" x="1302" y="186">schema, table, [keys], params</text>
  <text class="actorSub" x="1302" y="213">ACTIVITY_ID</text>
  <text class="actorSub" x="1302" y="240">CASE_ID</text>
  <text class="actorSub" x="1302" y="267">NOTE_ID</text>
  <text class="actorSub" x="1302" y="294">ACTIVITY_DATE</text>
  <text class="actorSub" x="1302" y="321">ACTIVITY_NOTE</text>
  <text class="actorSub" x="1302" y="348">CASE_DATE</text>
  <text class="actorSub" x="1302" y="375">CASE_TYPE</text>
  <text class="actorSub" x="1302" y="402">STATUS</text>
  <text class="actorSub" x="1302" y="429">NOTE_TEXT</text>

