  <rect class="actor" x="1037" y="130" width="210" height="110" rx="8"/>
  <rect class="actorHead" x="1037" y="130" width="210" height="34" rx="8"/>
  <text class="actorTitle" x="1048" y="153">FabricSet1</text>
  <text class="actorSub" x="1049" y="186">key / value</text>

