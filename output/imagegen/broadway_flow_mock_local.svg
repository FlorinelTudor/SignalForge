  <text class="stageTitle" x="786" y="108">Stage 2</text>
  <text class="stageTitle" x="1036" y="108">Stage 3</text>
  <text class="stageTitle" x="1286" y="108">LU Table</text>
  <text class="stageTitle" x="1596" y="108">Post Load</text>

  <!-- Input -->
  <rect class="actor" x="35" y="130" width="210" height="118" rx="8"/>
  <rect class="actorHeadPurple" x="35" y="130" width="210" height="34" rx="8"/>
  <text class="actorTitle" x="46" y="153">PopulationArgs</text>
  <text class="actorSub" x="47" y="186">id</text>

  <rect class="actor" x="35" y="266" width="210" height="95" rx="8"/>
  <rect class="actorHead" x="35" y="266" width="210" height="34" rx="8"/>
  <text class="actorTitle" x="46" y="289">SyncDeleteMode</text>
  <text class="actorSub" x="47" y="322">table</text>

