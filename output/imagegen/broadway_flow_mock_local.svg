  <rect class="actor" x="535" y="130" width="210" height="95" rx="8"/>
  <rect class="actorHeadGreen" x="535" y="130" width="210" height="34" rx="8"/>
  <text class="actorTitle" x="546" y="153">JavaScript1</text>
  <text class="actorSub" x="547" y="186">result</text>
  <text class="note" x="536" y="360">runBusiness = a || c || n</text>

