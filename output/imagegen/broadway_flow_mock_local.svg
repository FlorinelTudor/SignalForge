  <rect class="actor" x="1595" y="130" width="170" height="90" rx="8"/>
  <rect class="actorHead" x="1595" y="130" width="170" height="34" rx="8"/>
  <text class="actorTitle" x="1606" y="153">FabricSet1</text>
  <text class="actorSub" x="1607" y="186">g_activity_refreshed=false</text>

  <rect class="actor" x="1595" y="240" width="170" height="90" rx="8"/>
  <rect class="actorHead" x="1595" y="240" width="170" height="34" rx="8"/>
  <text class="actorTitle" x="1606" y="263">FabricSet2</text>
  <text class="actorSub" x="1607" y="296">g_cases_refreshed=false</text>

  <rect class="actor" x="1595" y="350" width="170" height="90" rx="8"/>
  <rect class="actorHead" x="1595" y="350" width="170" height="34" rx="8"/>
  <text class="actorTitle" x="1606" y="373">FabricSet3</text>
  <text class="actorSub" x="1607" y="406">g_case_note_refreshed=false</text>

  <!-- Connectors -->
  <path class="conn" d="M245 185 L287 185"/>
  <path class="conn" d="M492 185 L535 185"/>
  <path class="conn" d="M745 185 L785 185"/>
  <path class="conn" d="M995 185 L1037 185"/>
  <path class="conn" d="M1247 185 L1290 185"/>
  <path class="conn" d="M1560 185 L1595 175"/>
  <path class="conn" d="M1680 220 L1680 240"/>
  <path class="conn" d="M1680 330 L1680 350"/>
  <path class="conn" d="M492 372 L535 372"/>
  <path class="conn" d="M492 467 L535 467"/>
  <path class="conn" d="M492 562 L535 562"/>
  <path class="conn" d="M745 372 L785 210"/>

  <!-- Ports -->
  <circle class="portIn" cx="260" cy="185" r="5"/>
  <circle class="portIn" cx="510" cy="185" r="5"/>
  <circle class="portIn" cx="760" cy="185" r="5"/>
  <circle class="portIn" cx="1010" cy="185" r="5"/>
  <circle class="portIn" cx="1260" cy="185" r="5"/>
  <circle class="portOut" cx="1580" cy="175" r="5"/>
