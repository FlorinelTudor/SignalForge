  <rect class="stage" x="1020" y="80" width="240" height="880" rx="6"/>
  <rect class="stage" x="1270" y="80" width="300" height="880" rx="6"/>
  <rect class="stage" x="1580" y="80" width="200" height="880" rx="6"/>

  <text class="stageTitle" x="36" y="108">Input</text>
  <text class="stageTitle" x="286" y="108">Source</text>
